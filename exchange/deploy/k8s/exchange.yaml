# 最小 K8s 清单（学习用）：Deployment + Service
# 应用前需自建 Secret/ConfigMap 填 DATABASE_URL 等
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange
  labels:
    app: exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exchange
  template:
    metadata:
      labels:
        app: exchange
    spec:
      containers:
        - name: exchange
          image: exchange:local
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: DATABASE_URL
              value: "postgres://exchange:exchange@postgres:5432/exchange?sslmode=disable"
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: KAFKA_BROKERS
              value: "redpanda:9092"
            - name: RANKING_URL
              value: "http://ranking"
            - name: JWT_SECRET
              value: "change-me-in-prod"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: exchange
spec:
  selector:
    app: exchange
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking
  labels:
    app: ranking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ranking
  template:
    metadata:
      labels:
        app: ranking
    spec:
      containers:
        - name: ranking
          image: exchange:local
          command: ["/app/ranking"]
          ports:
            - containerPort: 8081
          env:
            - name: HTTP_ADDR
              value: ":8081"
            - name: DATABASE_URL
              value: "postgres://exchange:exchange@postgres:5432/exchange?sslmode=disable"
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: KAFKA_BROKERS
              value: "redpanda:9092"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ranking
spec:
  selector:
    app: ranking
  ports:
    - port: 80
      targetPort: 8081
  type: ClusterIP
