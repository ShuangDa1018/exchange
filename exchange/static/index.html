<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC-USDT Exchange</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --panel: #ffffff;
      --ink: #14212b;
      --muted: #6b7a86;
      --line: #d9e0e6;
      --buy: #0a7a52;
      --sell: #c23b2e;
      --buy-soft: #e7f6ef;
      --sell-soft: #fdeceb;
      --accent: #1f4b63;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      background:
        linear-gradient(180deg, #e8eef2 0%, transparent 220px),
        var(--bg);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      padding: 28px 24px 12px;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .nav {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }
    .nav a.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .user-switch {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }
    select, input, button {
      font: inherit;
    }
    select, input {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: #fff;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 24px 48px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 14px;
    }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .balances {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 14px;
    }
    .balances b { font-variant-numeric: tabular-nums; }
    .book {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 4px 0;
    }
    td { padding: 5px 0; }
    .bid td:first-child { color: var(--buy); }
    .ask td:first-child { color: var(--sell); }
    form.trade {
      display: grid;
      gap: 10px;
    }
    .sides {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .sides button {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    .sides button.active.buy {
      background: var(--buy-soft);
      border-color: var(--buy);
      color: var(--buy);
    }
    .sides button.active.sell {
      background: var(--sell-soft);
      border-color: var(--sell);
      color: var(--sell);
    }
    label {
      display: grid;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .submit {
      height: 42px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      background: var(--accent);
    }
    .submit.buy { background: var(--buy); }
    .submit.sell { background: var(--sell); }
    .orders li, .trades li {
      list-style: none;
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .orders ul, .trades ul { margin: 0; padding: 0; }
    .tag-buy { color: var(--buy); }
    .tag-sell { color: var(--sell); }
    .ghost {
      height: 30px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .err {
      color: var(--sell);
      font-size: 13px;
      min-height: 18px;
    }
    .span2 { grid-column: 1 / -1; }
    .btn-auth {
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-auth.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(20, 33, 43, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      backdrop-filter: blur(2px);
    }
    .modal-mask.open { display: flex; }
    .modal {
      width: min(380px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 22px 18px;
      box-shadow: 0 18px 48px rgba(20, 33, 43, 0.18);
      animation: pop 0.18s ease-out;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .modal h2 {
      margin: 0 0 4px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }
    .modal .hint {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .modal form { display: grid; gap: 12px; }
    .modal input { width: 100%; }
    .modal .actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .modal .actions button { flex: 1; height: 40px; }
    .quick {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .quick button {
      height: 28px;
      padding: 0 10px;
      border: 1px dashed var(--line);
      border-radius: 999px;
      background: #f7fafb;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    body.locked main {
      filter: grayscale(0.15);
      pointer-events: none;
      user-select: none;
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    .modal-head h2 { margin: 0; }
    .modal-close {
      flex: none;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f7fafb;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .modal-close:hover { color: var(--ink); border-color: #c5d0d6; }
  </style>
</head>
<body class="locked">
  <header>
    <div>
      <h1>BTC-USDT</h1>
      <div class="sub">交易服务 :8080 · 排行榜微服务 :8081 · Postgres/Redis/Kafka</div>
      <div class="nav">
        <a class="active" href="/">交易</a>
        <a href="/leaderboard.html">排行榜</a>
      </div>
    </div>
    <div class="user-switch">
      <span id="auth-status" style="color:var(--muted)">未登录</span>
      <button type="button" class="btn-auth primary" id="btn-login">登录</button>
      <button type="button" class="btn-auth" id="btn-register">注册</button>
      <button type="button" class="btn-auth" id="btn-logout" hidden>退出</button>
    </div>
  </header>

  <div class="modal-mask open" id="login-mask" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="modal">
      <div class="modal-head">
        <h2 id="login-title">登录交易所</h2>
        <button type="button" class="modal-close" id="auth-close" aria-label="关闭">×</button>
      </div>
      <div class="hint" id="auth-hint">演示账号：alice / alice · bob / bob；也可注册新用户</div>
      <form id="login-form">
        <label>用户名
          <input id="login-user" autocomplete="username" placeholder="alice 或自定义" required />
        </label>
        <label>密码
          <input id="login-pass" type="password" autocomplete="current-password" placeholder="至少 3 位" required />
        </label>
        <div class="quick" id="auth-quick">
          <button type="button" data-fill="alice">填入 alice</button>
          <button type="button" data-fill="bob">填入 bob</button>
        </div>
        <div class="err" id="login-err"></div>
        <div class="actions">
          <button type="button" class="btn-auth" id="auth-switch">去注册</button>
          <button type="submit" class="submit" id="auth-submit">登录获取 JWT</button>
        </div>
      </form>
    </div>
  </div>

  <main>
    <section class="panel span2">
      <h2>余额</h2>
      <div class="balances" id="balances">加载中…</div>
    </section>

    <section class="panel">
      <h2>订单簿</h2>
      <div class="book">
        <div>
          <table>
            <thead><tr><th>买价</th><th>数量</th></tr></thead>
            <tbody id="bids"></tbody>
          </table>
        </div>
        <div>
          <table>
            <thead><tr><th>卖价</th><th>数量</th></tr></thead>
            <tbody id="asks"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>下单</h2>
      <form class="trade" id="order-form">
        <div class="sides">
          <button type="button" class="active buy" data-side="buy">买入</button>
          <button type="button" class="sell" data-side="sell">卖出</button>
        </div>
        <label>价格 (USDT)
          <input id="price" type="number" step="0.01" min="0" value="100" required />
        </label>
        <label>数量 (BTC)
          <input id="qty" type="number" step="0.0001" min="0" value="0.1" required />
        </label>
        <button class="submit buy" id="submit" type="submit">买入 BTC</button>
        <div class="err" id="err"></div>
      </form>
    </section>

    <section class="panel">
      <h2>我的挂单</h2>
      <div class="orders"><ul id="orders"></ul></div>
    </section>

    <section class="panel">
      <h2>最近成交</h2>
      <div class="trades"><ul id="trades"></ul></div>
    </section>
  </main>

  <script>
    // go run . 后访问：http://localhost:8080/
    const API = location.origin.includes("5500") || location.protocol === "file:"
      ? "http://localhost:8080"
      : "";
    let side = "buy";
    let token = localStorage.getItem("exchange_token") || "";
    let currentUser = localStorage.getItem("exchange_user") || "";
    let pollTimer = null;
    let authMode = "login"; // login | register

    const $ = (id) => document.getElementById(id);

    function setAuthUI(loggedIn) {
      document.body.classList.toggle("locked", !loggedIn);
      $("btn-logout").hidden = !loggedIn;
      $("btn-login").textContent = loggedIn ? "切换账号" : "登录";
      $("btn-login").classList.toggle("primary", !loggedIn);
      $("btn-register").hidden = loggedIn;
      $("auth-status").textContent = loggedIn ? ("JWT ✓ " + currentUser) : "未登录";
    }

    function setAuthMode(mode) {
      authMode = mode;
      const isReg = mode === "register";
      $("login-title").textContent = isReg ? "注册交易所账号" : "登录交易所";
      $("auth-hint").textContent = isReg
        ? "新用户注册后立刻拿到 JWT，并获赠演示资金 10000 USDT + 1 BTC"
        : "演示账号：alice / alice · bob / bob；也可注册新用户";
      $("auth-quick").hidden = isReg;
      $("auth-switch").textContent = isReg ? "去登录" : "去注册";
      $("auth-submit").textContent = isReg ? "注册获取 JWT" : "登录获取 JWT";
      $("login-pass").autocomplete = isReg ? "new-password" : "current-password";
      $("login-err").textContent = "";
    }

    function openLogin(prefill, mode) {
      setAuthMode(mode || "login");
      $("login-mask").classList.add("open");
      $("login-err").textContent = "";
      if (prefill) {
        $("login-user").value = prefill;
        $("login-pass").value = authMode === "login" ? prefill : "";
      } else if (currentUser && authMode === "login") {
        $("login-user").value = currentUser;
        $("login-pass").value = "";
      } else if (authMode === "register") {
        $("login-user").value = "";
        $("login-pass").value = "";
      }
      setTimeout(() => $("login-user").focus(), 50);
    }

    function closeLogin() {
      $("login-mask").classList.remove("open");
    }

    async function authRequest(path, userID, password) {
      const res = await fetch((API || "") + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userID, password }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || (path.includes("register") ? "注册失败" : "登录失败"));
      token = body.token;
      currentUser = body.user_id || userID;
      localStorage.setItem("exchange_token", token);
      localStorage.setItem("exchange_user", currentUser);
      setAuthUI(true);
      closeLogin();
      return body;
    }

    async function login(userID, password) {
      return authRequest("/api/login", userID, password);
    }

    async function register(userID, password) {
      return authRequest("/api/register", userID, password);
    }

    function logout() {
      token = "";
      currentUser = "";
      localStorage.removeItem("exchange_token");
      localStorage.removeItem("exchange_user");
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
      $("balances").textContent = "请先登录";
      $("bids").innerHTML = "";
      $("asks").innerHTML = "";
      $("orders").innerHTML = "";
      $("trades").innerHTML = "";
      setAuthUI(false);
      openLogin();
    }

    async function api(path, options = {}) {
      if (!token) {
        openLogin();
        throw new Error("请先登录");
      }
      let res;
      try {
        res = await fetch((API || "") + path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
            ...(options.headers || {}),
          },
        });
      } catch {
        throw new Error("无法连接后端，请先：cd exchange && go run .  → 打开 http://localhost:8080/");
      }
      if (res.status === 401) {
        token = "";
        localStorage.removeItem("exchange_token");
        setAuthUI(false);
        openLogin(currentUser);
        throw new Error("登录已过期，请重新登录");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "请求失败");
      return data;
    }

    function money(n) {
      return Number(n).toLocaleString(undefined, { maximumFractionDigits: 8 });
    }

    async function refresh() {
      const [balances, book, orders, trades] = await Promise.all([
        api("/api/balances"),
        api("/api/book?depth=8"),
        api("/api/orders"),
        api("/api/trades?limit=12"),
      ]);

      $("balances").innerHTML = Object.keys(balances).length
        ? Object.entries(balances).map(([asset, b]) =>
            `<div><div>${asset}</div><b>${money(b.available)}</b> <span style="color:var(--muted)">可用</span>
             · <b>${money(b.locked)}</b> <span style="color:var(--muted)">冻结</span></div>`
          ).join("")
        : "暂无余额";

      $("bids").innerHTML = (book.bids || []).map((l) =>
        `<tr class="bid"><td>${money(l.price)}</td><td>${money(l.quantity)}</td></tr>`
      ).join("") || `<tr><td colspan="2" style="color:var(--muted)">暂无</td></tr>`;

      $("asks").innerHTML = (book.asks || []).map((l) =>
        `<tr class="ask"><td>${money(l.price)}</td><td>${money(l.quantity)}</td></tr>`
      ).join("") || `<tr><td colspan="2" style="color:var(--muted)">暂无</td></tr>`;

      $("orders").innerHTML = orders.length
        ? orders.map((o) => `
          <li>
            <span class="${o.side === "buy" ? "tag-buy" : "tag-sell"}">${o.side}</span>
            <span>#${o.id} ${money(o.price)} × ${money(o.quantity - o.filled)} 剩余</span>
            <button class="ghost" data-cancel="${o.id}">撤单</button>
          </li>`).join("")
        : `<li style="color:var(--muted);display:block">暂无挂单</li>`;

      $("trades").innerHTML = trades.length
        ? [...trades].reverse().map((t) => `
          <li>
            <span>${money(t.price)}</span>
            <span>${money(t.quantity)} BTC</span>
            <span style="color:var(--muted)">#${t.id}</span>
          </li>`).join("")
        : `<li style="color:var(--muted);display:block">暂无成交</li>`;
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        if (document.hidden || !token) return;
        refresh().catch(() => {});
      }, 3000);
    }

    document.querySelectorAll(".sides button").forEach((btn) => {
      btn.addEventListener("click", () => {
        side = btn.dataset.side;
        document.querySelectorAll(".sides button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const submit = $("submit");
        submit.textContent = side === "buy" ? "买入 BTC" : "卖出 BTC";
        submit.className = `submit ${side}`;
      });
    });

    $("order-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("err").textContent = "";
      try {
        await api("/api/orders", {
          method: "POST",
          body: JSON.stringify({
            side,
            price: Number($("price").value),
            quantity: Number($("qty").value),
          }),
        });
        await refresh();
      } catch (err) {
        $("err").textContent = err.message;
      }
    });

    $("orders").addEventListener("click", async (e) => {
      const id = e.target.dataset.cancel;
      if (!id) return;
      try {
        await api(`/api/orders/${id}`, { method: "DELETE" });
        await refresh();
      } catch (err) {
        $("err").textContent = err.message;
      }
    });

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("login-err").textContent = "";
      const uid = $("login-user").value.trim();
      const pass = $("login-pass").value;
      try {
        if (authMode === "register") await register(uid, pass);
        else await login(uid, pass);
        await refresh();
        startPolling();
      } catch (err) {
        $("login-err").textContent = err.message;
      }
    });

    document.querySelectorAll("[data-fill]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const u = btn.dataset.fill;
        $("login-user").value = u;
        $("login-pass").value = u;
        $("login-pass").focus();
      });
    });

    $("auth-switch").addEventListener("click", () => {
      setAuthMode(authMode === "login" ? "register" : "login");
      if (authMode === "register") {
        $("login-user").value = "";
        $("login-pass").value = "";
      }
      $("login-user").focus();
    });
    $("auth-close").addEventListener("click", closeLogin);
    $("login-mask").addEventListener("click", (e) => {
      if (e.target === $("login-mask")) closeLogin();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && $("login-mask").classList.contains("open")) {
        closeLogin();
      }
    });
    $("btn-login").addEventListener("click", () => openLogin(undefined, "login"));
    $("btn-register").addEventListener("click", () => openLogin(undefined, "register"));
    $("btn-logout").addEventListener("click", logout);

    (async () => {
      if (token && currentUser) {
        setAuthUI(true);
        closeLogin();
        try {
          await refresh();
          startPolling();
        } catch {
          logout();
        }
      } else {
        setAuthUI(false);
        openLogin("alice", "login");
      }
    })();
  </script>
</body>
</html>
